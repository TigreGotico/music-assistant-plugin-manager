[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-assistant-plugin-manager"
dynamic = ["version"]
description = "Entrypoint-based plugin discovery for Music Assistant — install providers as plain pip packages"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
music-assistant-community = "music_assistant_plugin_manager.__main__:main"

[project.urls]
Repository = "https://github.com/TigreGotico/music-assistant-plugin-manager"

[tool.setuptools.packages.find]
include = ["music_assistant_plugin_manager*"]

[tool.setuptools.dynamic]
version = { attr = "music_assistant_plugin_manager.version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
